# fly.toml app configuration file for Whabot
app = 'whabot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  DATA_DIR = '/var/data'
  DATABASE_URL = 'postgres://whabot:b51g1VGhWsMX5QY@metaai-db.flycast:5432/whabot_db?sslmode=disable'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 2

[[mounts]]
  source = 'whabot_data'
  destination = '/var/data'
  initial_size = '1gb'
